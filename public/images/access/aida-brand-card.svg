<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 560" width="100%" height="100%">
  <defs>
    <linearGradient id="aidaBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b6dec4"/>
      <stop offset="30%" stop-color="#d6e8be"/>
      <stop offset="60%" stop-color="#f8cca7"/>
      <stop offset="100%" stop-color="#f59458"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" rx="20" fill="url(#aidaBgGrad)"/>

  <!-- Brand Wordmark -->
  <g transform="translate(38, 52)">
    <text font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="34" font-weight="800" fill="#18181b" letter-spacing="-0.5">Aida<tspan font-size="36" fill="#18181b">.</tspan></text>
  </g>

  <!-- Graphic depth layers matching uploaded reference -->
  <rect x="250" y="110" width="130" height="230" rx="8" fill="#e89868" opacity="0.38"/>
  <rect x="230" y="440" width="130" height="130" rx="16" fill="#ee9662" opacity="0.45"/>

  <!-- Brand Tagline -->
  <g transform="translate(38, 310)">
    <text font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#18181b">
      <tspan x="0" y="0">Building iconic</tspan>
      <tspan x="0" y="24">brands that inspire,</tspan>
      <tspan x="0" y="48">connect, and lead.</tspan>
    </text>
  </g>

  <!-- Explore Services CTA Button -->
  <g transform="translate(38, 400)">
    <rect width="170" height="42" rx="21" fill="#18181b" filter="url(#softShadow)"/>
    <text x="85" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#ffffff" letter-spacing="1">EXPLORE SERVICES</text>
  </g>
</svg>
